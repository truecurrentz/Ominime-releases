name: build

on:
  push:
    branches:
      - main
      - arena/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: build
        run: |
          set -o pipefail
          NAME="$(git describe --tags --abbrev=0 2>/dev/null || echo 1.0)"
          gradle :app:assemblePhoneRelease :app:assembleTvRelease --stacktrace -Pvname="$NAME" 2>&1 | tee build.log

      - name: report
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|Caused by" build.log | head -80 > note.txt || true
          head -80 note.txt || true

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(0, 10);
            for (const line of lines) core.error(line.slice(0, 900));
            const all = text.split('\n').filter(Boolean);
            if (all.length) await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '```\n' + text.slice(-60000) + '\n```'
            });

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(10, 20);
            for (const line of lines) core.error(line.slice(0, 900));

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(20, 30);
            for (const line of lines) core.error(line.slice(0, 900));

      - name: inspect
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)"
          "$BT/aapt" dump badging ominime.apk 2>/dev/null | head -1 || true
          "$BT/apksigner" verify --print-certs ominime.apk 2>/dev/null | grep -i "SHA-256" | head -2 || true

      - run: |
          set -e
          find app/build/outputs/apk -name "*.apk" -type f
          cp "$(find app/build/outputs/apk -name 'app-phone-release.apk' -type f | head -1)" ominime.apk
          cp "$(find app/build/outputs/apk -name 'app-tv-release.apk' -type f | head -1)" ominime-tv.apk
          ls -l ominime.apk ominime-tv.apk

      - name: badge
        id: badge
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)"
          LINE="$("$BT/aapt" dump badging ominime.apk 2>/dev/null | head -1 || echo "no badge")"
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          echo "$LINE"

      - uses: actions/upload-artifact@v4
        with:
          name: ominime-apk
          path: |
            ominime.apk
            ominime-tv.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'branch' && github.repository == 'truecurrentz/Ominime-priv'
        with:
          tag_name: nightly
          name: Ominime nightly
          prerelease: true
          body: |
            Latest automatic build from the default branch.

            ominime.apk - phones and tablets
            ominime-tv.apk - Android TV, with the left rail and remote controls
          files: |
            ominime.apk
            ominime-tv.apk

      - name: manifest
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'truecurrentz/Ominime-priv'
        env:
          RUN: ${{ github.run_number }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os

          repo = os.environ.get("MIRROR_REPO", "truecurrentz/Ominime-priv")
          base = "https://github.com/" + repo + "/releases/download/" + os.environ.get("TAG", "latest") + "/"
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          out = {
              "stamp": stamp,
              "build": int(os.environ.get("RUN", "0") or 0),
              "repo": repo,
              "version": os.environ.get("TAG", ""),
              "phone": {"url": base + "ominime.apk", "size": os.path.getsize("ominime.apk")},
              "tv": {"url": base + "ominime-tv.apk", "size": os.path.getsize("ominime-tv.apk")},
          }
          open("manifest.json", "w").write(json.dumps(out, indent=1))
          print(json.dumps(out, indent=1))
          PY

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'branch'
        with:
          name: ominime-manifest
          path: manifest.json

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Ominime ${{ github.ref_name }}
          body: |
            Ominime ${{ github.ref_name }}

            ${{ steps.badge.outputs.line }}

            ominime.apk - phones and tablets
            ominime-tv.apk - Android TV, with the left rail and remote controls
          files: |
            ominime.apk
            ominime-tv.apk

      - name: mirror
        if: contains(github.event.head_commit.message, 'mirrorpush') && github.repository == 'truecurrentz/Ominime-priv'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PRIV: ${{ github.token }}
          REPO: truecurrentz/Ominime-releases
          TAG: v1.2.1
          RUN: ${{ github.run_number }}
        run: |
          set -e
          : > out.txt
          echo "mirror $REPO $TAG" >> out.txt
          if [ -z "$GH_TOKEN" ]; then echo "MIRROR_TOKEN is missing" >> out.txt; cat out.txt; exit 1; fi
          git config user.name "ominime bot"
          git config user.email "bot@ominime.app"
          URL="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          TREE="$(git rev-parse HEAD^{tree})"
          if git fetch -q "$URL" main:refs/remotes/pub/main 2>/dev/null; then
            OLD="$(git rev-parse refs/remotes/pub/main)"
            if [ "$(git rev-parse "$OLD^{tree}")" = "$TREE" ]; then
              echo "source already matches" >> out.txt
            else
              NEW="$(git commit-tree "$TREE" -p "$OLD" -m "sync source from build $RUN")"
              git push -q "$URL" "$NEW:refs/heads/main" && echo "source updated" >> out.txt
            fi
          else
            NEW="$(git commit-tree "$TREE" -m "ominime $TAG")"
            git push -q "$URL" "$NEW:refs/heads/main" && echo "source created" >> out.txt
          fi
          python3 - <<'PY'
          import datetime
          import json
          import os

          repo = "truecurrentz/Ominime-releases"
          tag = os.environ.get("TAG", "v1.2.1")
          base = "https://github.com/" + repo + "/releases/download/" + tag + "/"
          out = {
              "stamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "build": int(os.environ.get("RUN", "0") or 0),
              "repo": repo,
              "version": tag,
              "phone": {"url": base + "ominime.apk", "size": os.path.getsize("ominime.apk")},
              "tv": {"url": base + "ominime-tv.apk", "size": os.path.getsize("ominime-tv.apk")},
          }
          open("manifest.json", "w").write(json.dumps(out, indent=1))
          print(json.dumps(out, indent=1))
          PY
          head="$(git log -1 --pretty=%s | head -c 120)"
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --target main --title "Ominime $TAG" \
              --notes "Ominime $TAG, build $RUN. Source matches Ominime-priv at $head."
          gh release upload "$TAG" ominime.apk ominime-tv.apk manifest.json -R "$REPO" --clobber
          echo "--- releases" >> out.txt
          gh api "repos/$REPO/releases?per_page=20" \
            --jq '.[] | .tag_name + " assets: " + ([.assets[] | .name + " " + (.size|tostring)] | join(", "))' >> out.txt
          echo "--- tags" >> out.txt
          git ls-remote --tags "$URL" >> out.txt
          echo "--- repo" >> out.txt
          gh api "repos/$REPO" --jq '"private: " + (.private|tostring) + " default: " + .default_branch' >> out.txt
          sed -e "s#x-access-token:[^@]*#x-access-token:REDACTED#g" out.txt | tee clean.txt
          GH_TOKEN="$PRIV" gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@clean.txt >/dev/null
