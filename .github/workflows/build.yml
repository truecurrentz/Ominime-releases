name: build

on:
  push:
    branches:
      - main
      - arena/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: build
        run: |
          set -o pipefail
          gradle :app:assemblePhoneRelease :app:assembleTvRelease --stacktrace -Pvcode=${{ github.run_number }} 2>&1 | tee build.log

      - name: report
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|Caused by" build.log | head -80 > note.txt || true
          head -80 note.txt || true

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(0, 10);
            for (const line of lines) core.error(line.slice(0, 900));
            const all = text.split('\n').filter(Boolean);
            if (all.length) await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '```\n' + text.slice(-60000) + '\n```'
            });

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(10, 20);
            for (const line of lines) core.error(line.slice(0, 900));

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('note.txt', 'utf8'); } catch (e) {}
            const lines = text.split('\n').filter(l => l.startsWith('e: ')).slice(20, 30);
            for (const line of lines) core.error(line.slice(0, 900));

      - run: |
          set -e
          find app/build/outputs/apk -name "*.apk" -type f
          cp "$(find app/build/outputs/apk -name 'app-phone-release.apk' -type f | head -1)" ominime.apk
          cp "$(find app/build/outputs/apk -name 'app-tv-release.apk' -type f | head -1)" ominime-tv.apk
          ls -l ominime.apk ominime-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ominime-apk
          path: |
            ominime.apk
            ominime-tv.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'branch'
        with:
          tag_name: nightly
          name: Ominime nightly
          prerelease: true
          body: |
            Latest automatic build from the default branch.

            ominime.apk - phones and tablets
            ominime-tv.apk - Android TV, with the left rail and remote controls
          files: |
            ominime.apk
            ominime-tv.apk

      - name: manifest
        if: github.ref_type == 'branch'
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os

          repo = os.environ.get("MIRROR_REPO", "truecurrentz/ominime-builds")
          base = "https://github.com/" + repo + "/releases/download/nightly/"
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          out = {
              "stamp": stamp,
              "build": int(os.environ.get("RUN", "0") or 0),
              "repo": repo,
              "phone": {"url": base + "ominime.apk", "size": os.path.getsize("ominime.apk")},
              "tv": {"url": base + "ominime-tv.apk", "size": os.path.getsize("ominime-tv.apk")},
          }
          open("manifest.json", "w").write(json.dumps(out, indent=1))
          print(json.dumps(out, indent=1))
          PY

      - name: mirror
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          REPO="truecurrentz/ominime-builds"
          if [ -z "$GH_TOKEN" ]; then
            echo "MIRROR_TOKEN is not set, so the public copy was skipped"
            echo "Create a public repo, add a fine grained token as MIRROR_TOKEN and rerun"
            exit 0
          fi
          gh release view nightly -R "$REPO" >/dev/null 2>&1 || gh release create nightly -R "$REPO" --prerelease --title "Ominime nightly" --notes "Public builds of Ominime"
          gh release upload nightly ominime.apk ominime-tv.apk manifest.json -R "$REPO" --clobber
          gh release edit nightly -R "$REPO" --notes "Ominime for Android and Android TV. Build $RUN."

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'branch'
        with:
          name: ominime-manifest
          path: manifest.json

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ominime.apk
            ominime-tv.apk
